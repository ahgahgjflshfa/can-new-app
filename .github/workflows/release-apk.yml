name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose the APK build type for a manual run'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release

      - name: Build selected APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --${{ inputs.build_type }}

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}.apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
